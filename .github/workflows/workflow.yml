name: build workflow

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 
      - uses: actions/setup-node@v1
        with:
          node-version: '18'
      - run: npm install
        working-directory: /frontend
      - run: npm run build 
        working-directory: /frontend